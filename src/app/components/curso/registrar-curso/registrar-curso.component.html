<app-docente-header></app-docente-header>

<div class="container-fluid" style="background-color: #F5F5F5;">
  <div class="row">
    <nav class="col-md-3 col-lg-2 sidebar d-md-block p-3">
      <h5 class="fw-bold mb-4" style="color: #0D47A1;">Panel Docente</h5>
      <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
        <button class="nav-link active" id="v-pills-cursos-tab" data-bs-toggle="pill" data-bs-target="#v-pills-cursos" type="button" role="tab" style="border-radius: 0;">Cursos Dictados</button>
        <button class="nav-link" id="v-pills-comunicacion-tab" data-bs-toggle="pill" data-bs-target="#v-pills-comunicacion" type="button" role="tab" style="border-radius: 0;">Comunicacion</button>
        <button class="nav-link" id="v-pills-rendimiento-tab" data-bs-toggle="pill" data-bs-target="#v-pills-rendimiento" type="button" role="tab" style="border-radius: 0;">Rendimiento</button>
      </div>
    </nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
      <div class="tab-content" id="v-pills-tabContent">
        <div class="tab-pane fade show active" id="v-pills-cursos" role="tabpanel" aria-labelledby="v-pills-cursos-tab">
          <div class="card" style="border: 1px solid #E0E0E0; border-radius: 0; box-shadow: none;">
            <div class="card-header text-center" style="background-color: #1565C0; color: #FFFFFF; border-radius: 0;">
              <h2><strong>Crear Nuevo Curso</strong></h2>
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-center mb-3">
                <img src="img/curso/curso.png" width="200" height="200" class="img-fluid" alt="Imagen del curso">
              </div>
              <form class="row g-3" (ngSubmit)="registrarCurso()" #formCurso="ngForm">
                <div class="col-md-6">
                  <label class="form-label fw-semibold" style="color: #212121;">Nombre del Curso</label>
                  <input type="text" class="form-control" name="nombreCurso" [(ngModel)]="nuevoCurso.nombreCurso" placeholder="Ej: Electricidad Basica" required style="border-radius: 0; border: 1px solid #E0E0E0; color: #212121;">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" style="color: #212121;">Nivel</label>
                  <select class="form-select" name="nivel" [(ngModel)]="nuevoCurso.nivel" required style="border-radius: 0; border: 1px solid #E0E0E0; color: #212121;">
                    <option value="">Seleccionar nivel...</option>
                    <option>Basico</option>
                    <option>Intermedio</option>
                    <option>Avanzado</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" style="color: #212121;">Categoria</label>
                  <select class="form-select" name="idCategoria" [(ngModel)]="nuevoCurso.idCategoria" required style="border-radius: 0; border: 1px solid #E0E0E0; color: #212121;">
                    <option *ngFor="let categoria of categorias" [value]="categoria.id">{{ categoria.nombre }}</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" style="color: #212121;">Duracion (minutos)</label>
                  <input type="number" class="form-control" name="duracionMin" [(ngModel)]="nuevoCurso.duracionMin" placeholder="Ej: 120" required style="border-radius: 0; border: 1px solid #E0E0E0; color: #212121;">
                </div>
                <div class="col-md-12">
                  <label class="form-label fw-semibold" style="color: #212121;">Descripcion</label>
                  <textarea class="form-control" name="descripcion" [(ngModel)]="nuevoCurso.descripcion" rows="3" placeholder="Describe los objetivos y temario del curso..." required style="border-radius: 0; border: 1px solid #E0E0E0; color: #212121;"></textarea>
                </div>
                <div class="col-md-12">
                  <label class="form-label fw-semibold" style="color: #212121;">Resumen</label>
                  <textarea class="form-control" name="resumen" [(ngModel)]="nuevoCurso.resumen" rows="2" placeholder="Breve resumen del curso..." required style="border-radius: 0; border: 1px solid #E0E0E0; color: #212121;"></textarea>
                </div>
                <div class="col-md-12">
                  <label class="form-label fw-semibold" style="color: #212121;">Imagenes del Curso</label>
                  <div class="d-flex gap-2">
                    <div class="flex-fill">
                      <input class="form-control" type="file" accept="image/*" (change)="onFileSelected($event, 1)" required style="border-radius: 0; border: 1px solid #E0E0E0; color: #212121;">
                      <small *ngIf="nuevoCurso.imagenCurso1" class="text-success" style="color: #2E7D32;">
                        Imagen principal: <strong>{{ nuevoCurso.imagenCurso1 }}</strong>
                      </small>
                    </div>
                    <div class="flex-fill">
                      <input class="form-control" type="file" accept="image/*" (change)="onFileSelected($event, 2)" style="border-radius: 0; border: 1px solid #E0E0E0; color: #212121;">
                      <small *ngIf="nuevoCurso.imagenCurso2" class="text-success" style="color: #2E7D32;">
                        Imagen secundaria: <strong>{{ nuevoCurso.imagenCurso2 }}</strong>
                      </small>
                    </div>
                  </div>
                </div>
                <div class="col-12 d-flex justify-content-end gap-3 mt-3">
                  <button type="submit" class="btn btn-primary px-4" style="border-radius: 0; background-color: #1565C0; color: #FFFFFF; border: none;">Guardar Curso</button>
                  <button type="reset" class="btn btn-secondary px-4" style="border-radius: 0; background-color: #F5F5F5; color: #212121; border: 1px solid #E0E0E0;">Limpiar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="v-pills-comunicacion" role="tabpanel" aria-labelledby="v-pills-comunicacion-tab">
          <h5 style="color: #0D47A1;">Seccion de Comunicacion</h5>
        </div>
        <div class="tab-pane fade" id="v-pills-rendimiento" role="tabpanel" aria-labelledby="v-pills-rendimiento-tab">
          <h5 style="color: #0D47A1;">Panel de Rendimiento</h5>
        </div>
      </div>
    </main>
  </div>
</div>
