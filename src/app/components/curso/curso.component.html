<div class="container-xl py-4">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
      <span class="text-secondary small text-uppercase fw-semibold tracking-wider d-block">Gestión Docente</span>
      <h2 class="text-white fw-bold mb-0">Listado de Docentes</h2>
    </div>
    <a routerLink="/" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Ir al Inicio
    </a>
  </div>

  <div class="card dark-card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table custom-dark-table mb-0">
          <thead>
            <tr>
              <th class="ps-4">ID Docente</th>
              <th>Nombre Completo</th>
              <th class="text-end pe-4">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let docente of docentesC">
              <td class="ps-4 text-secondary small align-middle">#{{docente.idDocente}}</td>
              <td class="text-white fw-semibold align-middle">{{ docente.nombres || ('Docente Especialista #' + docente.idDocente) }}</td>
              <td class="text-end pe-4 align-middle">
                <button class="btn btn-primary btn-sm" (click)="ingresarDocente(docente.idDocente)">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar con Docente
                </button>
              </td>
            </tr>
            <tr *ngIf="docentesC && docentesC.length === 0">
              <td colspan="3" class="text-center py-4 text-secondary">
                No hay docentes registrados en la plataforma.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
