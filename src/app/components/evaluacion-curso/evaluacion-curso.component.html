<div class="container-quiz">

    <h1 *ngIf="evaluacion.length > 0">{{ evaluacion[0].titulo }}</h1>
    <p class="subtitle" *ngIf="evaluacion.length > 0">
        Evaluación del Curso - Sección: {{ evaluacion[0].idSeccion }}
    </p>

    <div class="progress-info">
        <small>{{ evaluaciones.length }} preguntas para evaluar tu conocimiento</small>
    </div>

    <form>

        <div *ngFor="let item of evaluaciones; let i = index" class="pregunta">

            <div class="pregunta-titulo">
                <span class="numero-pregunta">{{ i + 1 }}</span>
                {{ item.enunciado }}
            </div>

            <div class="form-check">
                <input 
                    class="form-check-input"
                    type="radio"
                    [name]="'q' + item.idPregunta"
                    [id]="'p' + item.idPregunta + '_o1'"
                    [value]="item.idOp1"
                >
                <label 
                    class="form-check-label"
                    [for]="'p' + item.idPregunta + '_o1'"
                >
                    {{ item.opcion1 }}
                </label>
            </div>

            <div class="form-check">
                <input 
                    class="form-check-input"
                    type="radio"
                    [name]="'q' + item.idPregunta"
                    [id]="'p' + item.idPregunta + '_o2'"
                    [value]="item.idOp2"
                >
                <label 
                    class="form-check-label"
                    [for]="'p' + item.idPregunta + '_o2'"
                >
                    {{ item.opcion2 }}
                </label>
            </div>

            <div class="form-check">
                <input 
                    class="form-check-input"
                    type="radio"
                    [name]="'q' + item.idPregunta"
                    [id]="'p' + item.idPregunta + '_o3'"
                    [value]="item.idOp3"
                >
                <label 
                    class="form-check-label"
                    [for]="'p' + item.idPregunta + '_o3'"
                >
                    {{ item.opcion3 }}
                </label>
            </div>

        </div>

        <div class="btn-group-actions">
            <button type="button" class="btn-enviar">
                Enviar Respuestas
            </button>

            <button type="reset" class="btn-limpiar">
                Limpiar
            </button>
        </div>
        <div style="margin-top: 20px; text-align: center;">
            <button type="button" class="btn-success" (click)="obtenerCertificado()" 
                    style="background-color: #2E7D32; color: #FFFFFF; padding: 12px 24px; border: none; font-weight: bold; cursor: pointer; width: 100%;">
                Obtener Certificado
            </button>
        </div>

    </form>

</div>
