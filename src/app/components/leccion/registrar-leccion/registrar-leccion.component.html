<app-docente-header></app-docente-header>

<div class="form-container-main">
  <div class="form-card">
    <div class="form-header">
      <h2>Crear Nueva Leccion</h2>
    </div>
    <div class="form-body">
      <form class="form-grid" (ngSubmit)="registrarSeccion()" #formLeccion="ngForm">

        <div class="form-group">
          <label class="form-label">Nombre Leccion</label>
          <input type="text" class="form-control" name="nombreLeccion" [(ngModel)]="nuevaLeccion.nombreLeccion" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Duracion (minutos)</label>
            <input type="number" class="form-control" name="duracion" [(ngModel)]="nuevaLeccion.duracion" required>
        </div>

        <div class="form-group">
            <label class="form-label">Orden Leccion</label>
            <input type="number" class="form-control" name="ordenLeccion" [(ngModel)]="nuevaLeccion.ordenLeccion" required>
        </div>

        <div class="form-group-full material-section">
          <label class="form-label text-primary">Recursos y Materiales</label>
          
          <div *ngFor="let material of nuevaLeccion.materiales; let i = index" class="material-row">
            <div class="material-col">
              <input type="text" class="form-control" placeholder="Nombre" [(ngModel)]="nuevaLeccion.materiales[i].nombreArchivo" name="nombreArchivo{{i}}">
            </div>
            
            <div class="material-col">
              <input type="file" class="form-control" (change)="onFileSelected($event, i)" name="archivoMaterial{{i}}" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg">
            </div>
            
            <div class="material-col-small">
              <button type="button" class="btn btn-danger" (click)="quitarMaterial(i)" title="Eliminar material">
                Eliminar
              </button>
            </div>
          </div>

          <button type="button" class="btn btn-secondary mt-2" (click)="agregarMaterial()">
            Añadir Material
          </button>
        </div>

        <div class="form-group-full">
          <label class="form-label">Link del Video de YouTube</label>
          <input type="text" class="form-control" name="urlVideo" [(ngModel)]="nuevaLeccion.urlVideo" (ngModelChange)="actualizarVistaPreviaVideo()" placeholder="Ej: https://www.youtube.com/watch?v=...">
        </div>

        <div class="form-group-full preview-section" *ngIf="videoUrlSegura">
          <label class="form-label text-primary">Vista Previa del Video</label>
          <div class="video-container">
            <iframe [src]="videoUrlSegura" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="!formLeccion.form.valid">Guardar Leccion</button>
        </div>

      </form>
    </div>
  </div>
</div>
