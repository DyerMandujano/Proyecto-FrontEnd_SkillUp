<app-docente-header></app-docente-header>

<div class="main-container">
  <div class="row-container">
    <nav class="sidebar">
      <h5 class="sidebar-title">Panel Docente</h5>
      <div class="nav-menu">
        <button class="nav-item active">Cursos Dictados</button>
        <button class="nav-item">Comunicacion</button>
        <button class="nav-item">Rendimiento</button>
      </div>
    </nav>

    <main class="content">
      <div class="tab-content">
        <div class="tab-pane">
          <h4 class="section-title">Lecciones del Curso</h4>
          <div class="actions">
            <button class="btn btn-primary" (click)="navegarRegistrarLeccion()">Ingresar Nueva Leccion</button>
            <button class="btn btn-secondary" (click)="volverASecciones()">Volver al Panel de Secciones</button>
          </div>
          
          <div class="table-container">
            <div *ngIf="lecciones.length === 0" class="alert-info">
              Actualmente el curso no cuenta con Lecciones.
            </div>

            <table *ngIf="lecciones.length > 0" class="custom-table">
              <thead>
                <tr>
                  <th>Id Leccion</th>
                  <th>Nombre Leccion</th>
                  <th>Orden Leccion</th>
                  <th>Duracion</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let leccion of lecciones">
                  <td>{{leccion.idLeccion}}</td>
                  <td>{{leccion.nombreLeccion}}</td>
                  <td>{{leccion.ordenLeccion}}</td>
                  <td>{{leccion.duracion}}</td>
                  <td>
                    <span class="badge" [ngClass]="leccion.estado === 1 ? 'badge-success' : 'badge-danger'">
                      {{ leccion.estado === 1 ? 'Activo' : 'Inactivo' }}
                    </span>
                  </td>
                  <td>
                    <div class="action-buttons">
                      <button class="btn btn-warning" (click)="navegarActualizarLeccion(leccion.idLeccion)">Actualizar</button>
                      <button class="btn btn-danger" (click)="eliminarLeccion(leccion.idLeccion)">Eliminar</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
