<app-docente-header></app-docente-header>
<a href=""></a>

<div class="container-fluid container-custom">
  <div class="row">

    <nav class="col-md-3 col-lg-2 sidebar d-md-block p-3">
      <h5 class="fw-bold mb-4 text-custom">Panel Docente</h5>
      <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
        <button class="nav-link active btn-sidebar" id="v-pills-cursos-tab" data-bs-toggle="pill" data-bs-target="#v-pills-cursos" type="button" role="tab">Cursos Dictados</button>
        <button class="nav-link btn-sidebar" id="v-pills-comunicacion-tab" data-bs-toggle="pill" data-bs-target="#v-pills-comunicacion" type="button" role="tab">Comunicacion</button>
        <button class="nav-link btn-sidebar" id="v-pills-rendimiento-tab" data-bs-toggle="pill" data-bs-target="#v-pills-rendimiento" type="button" role="tab">Rendimiento</button>
      </div>
    </nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 main-content">
      <div class="tab-content" id="v-pills-tabContent">

        <div class="tab-pane fade show active" id="v-pills-cursos" role="tabpanel" aria-labelledby="v-pills-cursos-tab">
          <div class="custom-card">
            <div class="custom-card-header">
              <h2 class="m-0 fw-bold">Actualizar Seccion</h2>
            </div>
            <div class="custom-card-body">
              <div class="d-flex justify-content-center mb-3">
                <img src="img/seccion/updSeccion.png" width="200" height="200" class="img-fluid mb-3" alt="Imagen del curso">
              </div>
              <form class="row g-3" (ngSubmit)="actualizarSeccion()" *ngIf="seccion.idSeccion">

                <div class="col-md-4">
                  <label class="form-label fw-semibold text-custom">Nombre Seccion</label>
                  <input type="text" class="form-control custom-input" 
                  name="nombreSeccion"
                  [(ngModel)]="seccion.nombreSeccion"
                  required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold text-custom">Orden Seccion</label>
                    <input type="number" class="form-control custom-input"
                          name="ordenSeccion"
                          [(ngModel)]="seccion.ordenSeccion"
                          placeholder="Ej: 5" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold text-custom">Estado</label>
                  <select class="form-select custom-input"
                          name="estado"
                          [(ngModel)]="seccion.estado"
                          required>
                    <option [value]="1">Activo</option>
                    <option [value]="0">Inactivo</option>
                  </select>
                </div>

                <div class="col-12 d-flex justify-content-end gap-3 mt-3">
                  <button type="submit" class="btn custom-btn-primary px-4">Actualizar Seccion</button>
                  <button type="reset" class="btn custom-btn-secondary px-4">Cancelar</button>
                </div>

              </form>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="v-pills-comunicacion" role="tabpanel" aria-labelledby="v-pills-comunicacion-tab">
          <h5 class="text-custom">Seccion de Comunicacion</h5>
        </div>

        <div class="tab-pane fade" id="v-pills-rendimiento" role="tabpanel" aria-labelledby="v-pills-rendimiento-tab">
          <h5 class="text-custom">Panel de Rendimiento</h5>
        </div>

      </div>
    </main>
  </div>
</div>
